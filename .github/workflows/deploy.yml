name: Validate Mini Message

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f config.js
          echo "Static site files are present."
      - name: Check for accidentally committed server keys
        run: |
          if grep -RInE 'service_role|SUPABASE_SERVICE_ROLE_KEY|CF_API_TOKEN' --exclude-dir=.git --exclude='README.md' .; then
            echo "Possible server-side secret detected. Review the match before deploying."
            exit 1
          fi
      - name: Check HTML references
        run: |
          grep -q 'style.css' index.html
          grep -q 'app.js' index.html
          echo "Static references look present."
