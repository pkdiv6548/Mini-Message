name: Mini Message CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required deployment files
        run: |
          test -f public/index.html
          test -f public/style.css
          test -f public/app.js
          test -f public/config.js
          test -f public/_headers
          grep -q 'style.css' public/index.html
          grep -q 'app.js' public/index.html
          grep -q 'config.js' public/index.html
      - name: Check JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/config.js
      - name: Check public assets for server-only secrets
        run: |
          if grep -RInE 'service_role|SUPABASE_SERVICE_ROLE_KEY|CLOUDFLARE_API_TOKEN' public/; then
            echo 'Possible server-only secret found in public files.'
            exit 1
          fi
          echo 'Static checks passed.'

  deploy:
    name: Deploy to Cloudflare Pages
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy public/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::warning::Deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub repository Actions secrets, then re-run this workflow.'
            exit 0
          fi
          npx --yes wrangler pages deploy public --project-name mini-message --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_EVENT_NAME"
